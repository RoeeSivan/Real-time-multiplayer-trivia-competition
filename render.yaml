# Render Blueprint — deploys both services from a single repo.
# Apply via: Render Dashboard → New → Blueprint → connect this repo.
# https://render.com/docs/blueprint-spec

services:
  # --- Backend: FastAPI + Socket.IO ---
  - type: web
    name: trivia-backend
    env: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Set in dashboard (sync:false = secret, never persisted in repo):
      - key: OPENAI_API_KEY
        sync: false
      # Set after frontend has a URL so CORS allows it (comma-sep allowed):
      - key: FRONTEND_URL
        sync: false

  # --- Frontend: Next.js (SSR) ---
  - type: web
    name: trivia-frontend
    env: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      # Set after backend has a URL:
      - key: NEXT_PUBLIC_API_URL
        sync: false
